name: CI

on:
  pull_request:

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: von
          POSTGRES_PASSWORD: von_ci_password
          POSTGRES_DB: von_ci
        options: >-
          --health-cmd "pg_isready -U von"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://von:von_ci_password@localhost:5432/von_ci
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-that-is-at-least-32-chars!!
      BETTER_AUTH_URL: http://localhost:8080
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build packages
        run: bun run build

      - name: Push schema to CI database
        working-directory: packages/db
        run: bun run db:push

      - name: Run tests
        run: bun run test
