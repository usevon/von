name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: blacksmith-2vcpu-ubuntu-2404

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: von
          POSTGRES_PASSWORD: von_ci_password
          POSTGRES_DB: von_ci
        options: >-
          --health-cmd "pg_isready -U von -d von_ci"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://von:von_ci_password@localhost:5432/von_ci
      REDIS_URL: redis://localhost:6379
      API_KEY_SIGNING_SECRET: ci-test-signing-secret
      BETTER_AUTH_SECRET: ci-test-secret-that-is-at-least-32-chars!!

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services

      - name: Format
        run: cargo fmt --manifest-path services/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path services/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Migrate
        run: cargo run --manifest-path services/Cargo.toml -p von-migrate -- run

      - name: Test
        run: cargo test --manifest-path services/Cargo.toml

  typescript:
    name: TypeScript
    runs-on: blacksmith-2vcpu-ubuntu-2404

    env:
      NODE_ENV: test
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build packages
        run: bunx turbo run build --filter="./packages/*"

      - name: Test
        run: bun run test:unit
