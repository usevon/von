[workspace]
resolver = "2"
members = [
    "crates/von-error",
    "crates/von-log",
    "crates/von-migrate",
    "crates/von-types",
    "crates/von-billing",
    "crates/von-api",
    "crates/von-ingest",
    "crates/von-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
von-api = { path = "crates/von-api" }
von-billing = { path = "crates/von-billing" }
von-error = { path = "crates/von-error" }
von-log = { path = "crates/von-log" }
von-migrate = { path = "crates/von-migrate" }
von-types = { path = "crates/von-types" }

aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
# Object key order is preserved so jsonb columns serialize in the same order the TypeScript service emits.
serde_html_form = "0.4"
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
